name: security

# Grok/OWASP-style checks, adopted where they apply to VeriFlow:
#  - Trivy: known-vulnerable dependencies (npm, pip, cargo) and committed secrets, on every push
#  - ZAP baseline: passive scan of OUR deployed site, run by hand with its URL
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Deployed VeriFlow URL to scan with ZAP baseline (our own site only)"
        required: false

jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies and secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  zap-baseline:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target != ''
    runs-on: ubuntu-latest
    steps:
      - name: ZAP baseline (passive)
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ github.event.inputs.target }}
          allow_issue_writing: false
          fail_action: false
