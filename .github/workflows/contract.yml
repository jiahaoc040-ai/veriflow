name: contract

# Builds the VeriFlow registry smart contract to Wasm, runs the unit and
# end-to-end tests against the compiled module, and publishes the module as a
# release asset so it can be deployed with `npm run contract -- deploy`.
on:
  push:
    branches: [main]
    paths: ["contract/**", "contract-v2/**", "contract-escrow/**", ".github/workflows/contract.yml"]
  pull_request:
    branches: [main]
    paths: ["contract/**", "contract-v2/**", "contract-escrow/**", ".github/workflows/contract.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: contract
            release: registry-module
          - dir: contract-v2
            release: registry-module-v2
          - dir: contract-escrow
            release: escrow-module
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain with Wasm targets
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown wasm32v1-none

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cargo-concordium
            ~/.cargo/registry
            ${{ matrix.dir }}/target
          key: cargo-${{ runner.os }}-${{ matrix.dir }}-${{ hashFiles(format('{0}/Cargo.toml', matrix.dir)) }}

      - name: Install cargo-concordium
        run: command -v cargo-concordium || cargo install --locked cargo-concordium

      - name: Build module (schema embedded)
        run: |
          # contract-escrow also builds the CIS-8004 test double its chain tests run against
          if [ -x build.sh ]; then ./build.sh; exit 0; fi
          mkdir -p concordium-out
          cargo concordium build --schema-embed --out concordium-out/module.wasm.v1
          cargo concordium build --schema-json-out concordium-out/
          ls -la concordium-out
          sha256sum concordium-out/module.wasm.v1

      - name: Unit + end-to-end tests
        run: cargo test

      # The escrow is deployed from a verifiable build: CCDExplorer can rebuild it from the published sources
      - name: Verifiable build (escrow only)
        if: matrix.dir == 'contract-escrow'
        run: |
          cargo concordium build --verifiable \
            --source-link https://github.com/${{ github.repository }}/releases/download/escrow-module/verified.wasm.v1.tar \
            --schema-embed --out concordium-out/verified.wasm.v1
          ls -la concordium-out
          sha256sum concordium-out/verified.wasm.v1

      - name: Publish the verifiable module and its sources (escrow only)
        if: matrix.dir == 'contract-escrow' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view escrow-module >/dev/null 2>&1 || \
            gh release create escrow-module --title "VeriFlow escrow module" --notes "Verifiable build of contract-escrow/, made by CI."
          gh release upload escrow-module concordium-out/verified.wasm.v1.tar concordium-out/verified.wasm.v1 --clobber
          # Rebuild from the published sources and compare, as a verifier would
          cargo concordium verify-build --module concordium-out/verified.wasm.v1

      - name: Upload module artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.release }}
          path: ${{ matrix.dir }}/concordium-out/

      - name: Publish module as release asset
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ${{ matrix.release }} >/dev/null 2>&1 || \
            gh release create ${{ matrix.release }} --title "VeriFlow ${{ matrix.dir }} module" \
              --notes "Built by CI from ${{ matrix.dir }}/."
          gh release upload ${{ matrix.release }} concordium-out/module.wasm.v1 --clobber
