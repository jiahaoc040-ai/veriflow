name: contract

# Builds the VeriFlow registry smart contract to Wasm, runs the unit and
# end-to-end tests against the compiled module, and publishes the module as a
# release asset so it can be deployed with `npm run contract -- deploy`.
on:
  push:
    branches: [main]
    paths: ["contract/**", "contract-v2/**", "contract-escrow/**", ".github/workflows/contract.yml"]
  pull_request:
    branches: [main]
    paths: ["contract/**", "contract-v2/**", "contract-escrow/**", ".github/workflows/contract.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: contract
            release: registry-module
          - dir: contract-v2
            release: registry-module-v2
          - dir: contract-escrow
            release: escrow-module
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain with Wasm targets
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown wasm32v1-none

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cargo-concordium
            ~/.cargo/registry
            ${{ matrix.dir }}/target
          key: cargo-${{ runner.os }}-${{ matrix.dir }}-${{ hashFiles(format('{0}/Cargo.toml', matrix.dir)) }}

      - name: Install cargo-concordium
        run: command -v cargo-concordium || cargo install --locked cargo-concordium

      - name: Build module (schema embedded)
        run: |
          # contract-escrow also builds the CIS-8004 test double its chain tests run against
          if [ -x build.sh ]; then ./build.sh; exit 0; fi
          mkdir -p concordium-out
          cargo concordium build --schema-embed --out concordium-out/module.wasm.v1
          cargo concordium build --schema-json-out concordium-out/
          ls -la concordium-out
          sha256sum concordium-out/module.wasm.v1

      - name: Unit + end-to-end tests
        run: cargo test

      # The escrow is deployed from a verifiable build: CCDExplorer can rebuild it from the published sources
      - name: Verifiable build (escrow only)
        if: matrix.dir == 'contract-escrow'
        env:
          ESCROW_RELEASE: escrow-module-v2
        run: |
          # One release per deployed version: a later build must never replace the sources an earlier contract links to
          cargo concordium build --verifiable \
            --source-link https://github.com/${{ github.repository }}/releases/download/${ESCROW_RELEASE}/verified.wasm.v1.tar \
            --schema-embed --out concordium-out/verified.wasm.v1
          ls -la concordium-out
          sha256sum concordium-out/verified.wasm.v1

      - name: Publish the verifiable module and its sources (escrow only)
        if: matrix.dir == 'contract-escrow' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          ESCROW_RELEASE: escrow-module-v2
        run: |
          gh release view ${ESCROW_RELEASE} >/dev/null 2>&1 || \
            gh release create ${ESCROW_RELEASE} --title "VeriFlow escrow module (${ESCROW_RELEASE})" --notes "Verifiable build of contract-escrow/, made by CI."
          # Never replace a published version: a contract may already link to it. Bump ESCROW_RELEASE for new sources
          if gh release download ${ESCROW_RELEASE} -p verified.wasm.v1 -D /tmp/published 2>/dev/null; then
            echo "published: $(sha256sum /tmp/published/verified.wasm.v1)"
            echo "this build: $(sha256sum concordium-out/verified.wasm.v1)"
            cmp -s /tmp/published/verified.wasm.v1 concordium-out/verified.wasm.v1 || echo "::warning::contract-escrow changed but ${ESCROW_RELEASE} is already published; bump ESCROW_RELEASE to publish it"
            cargo concordium verify-build --module /tmp/published/verified.wasm.v1
          else
            gh release upload ${ESCROW_RELEASE} concordium-out/verified.wasm.v1.tar concordium-out/verified.wasm.v1
            # Rebuild from the published sources and compare, as a verifier would
            cargo concordium verify-build --module concordium-out/verified.wasm.v1
          fi

      # The first escrow, <13170,0>, links to escrow-module, whose files an earlier run of this workflow replaced.
      # Put back that version's files from the CI artifact of the run that built it, only if it is byte for byte the module on chain
      - name: Restore the sources of escrow v1 (escrow only)
        if: matrix.dir == 'contract-escrow' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          V1_RUN: "45950187878"
          V1_MODULE: 0094e91830a15ece653402e75eaf0d8c841df3d4e7d6c9bff35698b9be821457
        run: |
          set -e
          cur=$(gh release download escrow-module -p verified.wasm.v1 -O - -R ${{ github.repository }} | sha256sum | cut -d' ' -f1)
          if [ "$cur" = "$V1_MODULE" ]; then echo "escrow-module already holds v1"; exit 0; fi
          rm -rf /tmp/v1 && gh run download "$V1_RUN" -n escrow-module -D /tmp/v1 -R ${{ github.repository }}
          got=$(sha256sum /tmp/v1/verified.wasm.v1 | cut -d' ' -f1)
          echo "v1 artifact: $got"
          if [ "$got" = "$V1_MODULE" ]; then
            gh release upload escrow-module /tmp/v1/verified.wasm.v1.tar /tmp/v1/verified.wasm.v1 --clobber -R ${{ github.repository }}
            cargo concordium verify-build --module /tmp/v1/verified.wasm.v1
          else
            echo "::warning::the v1 artifact is not the module on chain; escrow-module left as is"
          fi

      - name: Upload module artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.release }}
          path: ${{ matrix.dir }}/concordium-out/

      - name: Publish module as release asset
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ${{ matrix.release }} >/dev/null 2>&1 || \
            gh release create ${{ matrix.release }} --title "VeriFlow ${{ matrix.dir }} module" \
              --notes "Built by CI from ${{ matrix.dir }}/."
          gh release upload ${{ matrix.release }} concordium-out/module.wasm.v1 --clobber
