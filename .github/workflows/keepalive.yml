name: keepalive

# Render's free instance sleeps after 15 idle minutes; a request every 10 minutes keeps it warm.
# GitHub may delay or skip scheduled runs, so a cold start is less likely, not impossible.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --max-time 90 https://veriflow-yrhp.onrender.com/health -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n"
