name: keepalive

# Render's free plan sleeps after 15 idle minutes; a judge opening the page
# would wait ~1 minute. Ping the public URL every 10 minutes instead.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 120 "${{ vars.PUBLIC_URL || 'https://veriflow-yrhp.onrender.com' }}/health"
