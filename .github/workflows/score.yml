name: score

# Runs the published scoring rule (docs/SCORING.md, gateway/src/score.ts) on GitHub's machines,
# reading only the Concordium chain, the CCDScan indexer (checked against the contract's own
# counter) and Binance daily candles. Nothing comes from VeriFlow's server or database.
on:
  schedule:
    - cron: "37 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  score:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - run: npm ci
      - run: npm run score -- --spec-hash
      - run: npm run score
      - run: cat score-report.json >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        with:
          name: score-report
          path: gateway/score-report.json
