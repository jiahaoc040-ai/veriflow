name: score

# Runs the published scoring rule (docs/SCORING.md, gateway/src/score.ts) on GitHub's machines,
# reading only the Concordium chain, the CCDScan indexer (checked against the contract's own
# counter) and Binance daily candles. Nothing comes from VeriFlow's server or database.
on:
  schedule:
    - cron: "37 1,13 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  score:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - run: npm ci
      - run: npm run score -- --spec-hash
      - run: npm run score
      - if: always()
        name: Readable summary (visible without signing in)
        run: |
          r=score-report.json
          [ -f "$r" ] || { echo "No report: the run stopped before scoring. See the log." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          jq -r '
            "## VeriFlow scoring rule v1 — retired contract `\(.contract)`",
            "",
            "Run \(.run_at). Registered text: `\(.hashes.data)`",
            "",
            "Commit integrity \(.integrity.window | join(" → ")): \(.integrity.commit.numerator) / \(.integrity.commit.denominator). Reveal integrity: \(.integrity.reveal.numerator) / \(.integrity.reveal.denominator).",
            "",
            (.integrity.failures | map("- \(.day) \(.asset): \(.reason)") | join("\n")),
            "",
            "**Performance:** " + (if .performance.published then "published" else "not published — \(.performance.reason)" end)
          ' "$r" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: score-report
          path: gateway/score-report.json
