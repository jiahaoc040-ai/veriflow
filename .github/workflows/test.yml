name: test

# Unit tests on every push and every pull request (including Dependabot's),
# so dependency updates are checked before anyone merges them.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # same as the Debian bookworm image
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "26"       # same as the Docker image
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  guard-package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/concordium-x402-guard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"       # the oldest Node a user of the package is likely to have
      - run: npm ci
      - run: npm run build
      - run: npm test

  seller-package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/concordium-x402-seller
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"       # the oldest Node a user of the package is likely to have
      - run: npm ci
      - run: npm run build
      - run: npm run check:examples
      - run: npm test
