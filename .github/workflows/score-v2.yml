name: score-v2

# Runs the published scoring rule (docs/SCORING-v2.md, gateway/src/score-v2.ts) on GitHub's machines,
# reading only contract v2 state from a Concordium node and Binance daily candles.
on:
  schedule:
    # GitHub delays or skips scheduled runs; four chances a day
    - cron: "47 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency: score-v2

jobs:
  score:
    if: ${{ vars.REGISTRY_V2_CONTRACT != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - run: npm ci
      - run: npm run score2 -- --spec-hash
      - run: npm run score2
        env:
          SCORING_V2_ANCHOR_TX: ${{ vars.SCORING_V2_ANCHOR_TX }}
      - if: always()
        name: Readable summary (visible without signing in)
        run: |
          r=score-v2-report.json
          [ -f "$r" ] || { echo "No report: the run stopped before scoring. See the log." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          jq -r '
            "## VeriFlow scoring rule v2 — contract `\(.contract)`",
            "",
            "Run \(.run_at), valid until \(.valid_until).",
            "",
            "**Rule anchor:** " + (if .complete then "verified — the scripts run here are byte-identical to the rule registered on-chain before the first commit, and the contract is the named deployment" else "NOT verified: " + (.problems | join("; ")) end),
            "",
            "Registered text: `\(.hashes.data)`",
            "",
            "| | |", "|---|---|",
            "| Commit integrity \(.integrity.window | join(" → ")) | \(.integrity.commit.numerator) / \(.integrity.commit.denominator) required slots committed |",
            "| Reveal integrity | \(.integrity.reveal.numerator) / \(.integrity.reveal.denominator) due calls revealed and matching Binance |",
            "",
            (if (.integrity.failures | length) > 0 then "**Failures:**\n" + (.integrity.failures | map("- \(.as_of) \(.asset): \(.reason)") | join("\n")) else "No failures." end),
            "",
            (if .performance.published then
              "**Performance** (\(.performance.unit)): \(.performance.scored_days) scored days · signal \(.performance.mean_7d_return_signal) · always on \(.performance.mean_7d_return_always_on) · always off 0 · x vs always on \(.performance.x_vs_always_on) · \(.performance.caveat)"
             else "**Performance:** not published — \(.performance.reason). Pending days (exit candle still open): \(.performance.pending_days | length)." end)
          ' "$r" > score-v2-summary.md
          {
            echo; echo "**The calls scored** (read from contract \`<13115,0>\` on a Concordium node; commitment = SHA-256 of the call text, revealed after 7 days):"; echo
            echo "| day (close) | asset | commitment | committed at (UTC) | revealed |"; echo "|---|---|---|---|---|"
            d=$(jq -r '.integrity.window[0] // empty' "$r"); end=$(jq -r '.integrity.window[1] // empty' "$r")
            while [ -n "$d" ] && [[ ! "$d" > "$end" ]]; do
              for a in BTC ETH; do
                s=$(npm run -s contract2 -- slot "$a" "$d" 2>/dev/null || echo null)
                echo "$s" | jq -r --arg d "$d" --arg a "$a" 'if . == null then "| \($d) | \($a) | — (no commit) | | |" else "| \($d) | \($a) | `\(.commitment)` | \(.committed_at) | \(if .reveal then "yes" else "not yet" end) |" end' 2>/dev/null || echo "| $d | $a | (node read failed) | | |"
              done
              d=$(date -u -d "$d + 1 day" +%F)
            done
          } >> score-v2-summary.md
          cat score-v2-summary.md >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: score-v2-report
          path: |
            gateway/score-v2-report.json
            gateway/score-v2-summary.md

  # A separate job holds the write token; it only downloads the report and pushes the score-reports branch.
  publish:
    needs: score
    if: ${{ always() && needs.score.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: score-v2-report
          path: report
      - name: Publish the report where anyone can read it (branch score-reports)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f report/score-v2-report.json ] || { echo "no report"; exit 0; }
          git init -q pub && cd pub
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin score-reports && git checkout -q -b score-reports FETCH_HEAD || git checkout -q --orphan score-reports
          mkdir -p score-v2/history
          stamp=$(jq -r .run_at ../report/score-v2-report.json | tr -d ':')
          cp ../report/score-v2-report.json score-v2/latest.json
          cp ../report/score-v2-report.json "score-v2/history/$stamp.json"
          { cat ../report/score-v2-summary.md; echo; echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID · code at commit $GITHUB_SHA"; } > score-v2/README.md
          git config user.name "score-v2 workflow"; git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -qm "score-v2 report $stamp" && git push -q origin HEAD:refs/heads/score-reports
