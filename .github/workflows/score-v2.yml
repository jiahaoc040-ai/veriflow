name: score-v2

# Runs the published scoring rule (docs/SCORING-v2.md, gateway/src/score-v2.ts) on GitHub's machines,
# reading only contract v2 state from a Concordium node and Binance daily candles.
on:
  schedule:
    # GitHub delays or skips scheduled runs; four chances a day
    - cron: "47 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  score:
    if: ${{ vars.REGISTRY_V2_CONTRACT != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - run: npm ci
      - run: npm run score2 -- --spec-hash
      - run: npm run score2
        env:
          SCORING_V2_ANCHOR_TX: ${{ vars.SCORING_V2_ANCHOR_TX }}
      - if: always()
        name: Readable summary (visible without signing in)
        run: |
          r=score-v2-report.json
          [ -f "$r" ] || { echo "No report: the run stopped before scoring. See the log." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          jq -r '
            "## VeriFlow scoring rule v2 — contract `\(.contract)`",
            "",
            "Run \(.run_at), valid until \(.valid_until).",
            "",
            "**Rule anchor:** " + (if .complete then "verified — the scripts run here are byte-identical to the rule registered on-chain before the first commit, and the contract is the named deployment" else "NOT verified: " + (.problems | join("; ")) end),
            "",
            "Registered text: `\(.hashes.data)`",
            "",
            "| | |", "|---|---|",
            "| Commit integrity \(.integrity.window | join(" → ")) | \(.integrity.commit.numerator) / \(.integrity.commit.denominator) required slots committed |",
            "| Reveal integrity | \(.integrity.reveal.numerator) / \(.integrity.reveal.denominator) due calls revealed and matching Binance |",
            "",
            (if (.integrity.failures | length) > 0 then "**Failures:**\n" + (.integrity.failures | map("- \(.as_of) \(.asset): \(.reason)") | join("\n")) else "No failures." end),
            "",
            (if .performance.published then
              "**Performance** (\(.performance.unit)): \(.performance.scored_days) scored days · signal \(.performance.mean_7d_return_signal) · always on \(.performance.mean_7d_return_always_on) · always off 0 · x vs always on \(.performance.x_vs_always_on) · \(.performance.caveat)"
             else "**Performance:** not published — \(.performance.reason). Pending days (exit candle still open): \(.performance.pending_days | length)." end)
          ' "$r" >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: score-v2-report
          path: gateway/score-v2-report.json
