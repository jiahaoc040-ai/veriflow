[package]
name = "veriflow-registry-v2"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "VeriFlow signal registry v2: one call per asset and day, enforced on-chain"

[features]
bump_alloc = ["concordium-std/bump_alloc"]

[dependencies]
concordium-std = "11.0"

[dev-dependencies]
concordium-smart-contract-testing = "5.0"
sha2 = "0.11"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "s"
codegen-units = 1
